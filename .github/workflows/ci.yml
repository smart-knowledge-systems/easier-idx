name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      # Build dependency packages in topological order so that each
      # package's tsc --emitDeclarationOnly step can resolve workspace
      # imports through the built dist/*.d.ts. Per-package
      # tsconfig.build.json clears the source-level path aliases set
      # in the root tsconfig.
      - name: Build workspace deps (topological)
        run: |
          bun run --filter '@easier-idx/logging' build
          bun run --filter '@easier-idx/clustering' build
          bun run --filter '@easier-idx/core' build

      - run: bun run check
      - run: bun test
